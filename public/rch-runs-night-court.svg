<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Illuminated city basketball court at night">
<defs>
 <linearGradient id="sky" x1="0" x2=".7" y2="1"><stop stop-color="#030a1a"/><stop offset=".55" stop-color="#0c366d"/><stop offset="1" stop-color="#020711"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#4da9ff" stop-opacity=".56"/><stop offset=".35" stop-color="#1679e7" stop-opacity=".26"/><stop offset="1" stop-color="#1474cb" stop-opacity="0"/></radialGradient>
 <radialGradient id="warm"><stop stop-color="#ffe5a4" stop-opacity=".90"/><stop offset=".12" stop-color="#f0ba62" stop-opacity=".35"/><stop offset="1" stop-color="#f0a850" stop-opacity="0"/></radialGradient>
 <linearGradient id="ground" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#12385b"/><stop offset=".38" stop-color="#0b2747"/><stop offset="1" stop-color="#030b19"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#2370e4" stop-opacity=".5"/><stop offset="1" stop-color="#98d6ff" stop-opacity=".96"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="lightblur"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="fence" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M-13.5 0 13.5 27 40.5 0M-13.5 27 13.5 0 40.5 27" fill="none" stroke="#6ca0cf" stroke-width=".75" opacity=".42"/></pattern>
 <pattern id="windows" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M7 7h5v8H7zm12 6h4v6h-4z" fill="#4ba4ff" opacity=".33"/></pattern>
 <pattern id="noise" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M2 3h1v1H2zm4 1h1v1H6z" fill="#aacdeb" opacity=".13"/></pattern>
</defs>
<path d="M0 0H1400V700H0z" fill="url(#sky)"/>
