name: Repair Database Types

on:
  push:
    branches:
      - feature/rcl-platform-upgrade

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/rcl-platform-upgrade
      - name: Restore canonical database types and add fan badges
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:src/types/database.ts > src/types/database.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/types/database.ts')
          text = path.read_text()
          table = "      fan_badges: { Row: FanBadge; Insert: Insert<FanBadge>; Update: Update<FanBadge> };\n"
          if 'fan_badges:' not in text:
              text = text.replace(
                  '      coach_badges: { Row: CoachBadge; Insert: Insert<CoachBadge>; Update: Update<CoachBadge> };\n',
                  '      coach_badges: { Row: CoachBadge; Insert: Insert<CoachBadge>; Update: Update<CoachBadge> };\n' + table,
                  1,
              )
          interface_block = "export interface FanBadge { id: string; profile_id: string; badge_id: string; earned_at: string; created_at: string; }\n"
          if 'export interface FanBadge ' not in text:
              text = text.replace(
                  'export interface CoachBadge {',
                  interface_block + 'export interface CoachBadge {',
                  1,
              )
          path.write_text(text)
          PY
      - name: Commit repaired types
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore canonical database types"
          git push origin HEAD:feature/rcl-platform-upgrade
