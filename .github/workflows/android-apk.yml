name: Build RCH Android APK

on:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
      - public/.well-known/assetlinks.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android Trusted Web Activity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and Bubblewrap
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm install --global @bubblewrap/cli
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android project
        run: |
          set -euo pipefail
          cd android
          jq --argjson code "$((1000 + GITHUB_RUN_NUMBER))" '.appVersionCode=$code | .appVersion=("1.0."+($code|tostring))' twa-manifest.json > twa-manifest.next.json
          mv twa-manifest.next.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade

      - name: Build unsigned APK (PR validation only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cd android
          bubblewrap build --skipSigning
          mkdir -p ../dist
          apk="$(find . -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" ../dist/RCH-Android-UNSIGNED-NOT-INSTALLABLE.apk

      - name: Build signed APK (manual release only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          RCH_KEYSTORE_BASE64: ${{ secrets.RCH_ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.RCH_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.RCH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RCH_KEYSTORE_BASE64" || -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure RCH_ANDROID_KEYSTORE_BASE64 and RCH_ANDROID_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          printf '%s' "$RCH_KEYSTORE_BASE64" | base64 --decode > android/android.keystore
          chmod 600 android/android.keystore
          keytool -list -v -keystore android/android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias rch_release \
            | grep -F "C8:8E:3D:2C:D3:4E:85:04:31:60:C4:70:51:CD:4D:4E:20:84:39:B7:F2:AA:90:23:74:FA:C6:EA:07:BF:18:6E" >/dev/null || {
              echo "::error::The signing key does not match RCH's public Digital Asset Links fingerprint."
              exit 1
            }
          cd android
          bubblewrap build
          mkdir -p ../dist
          test -s app-release-signed.apk
          cp app-release-signed.apk ../dist/RCH-Android.apk
          (cd ../dist && sha256sum RCH-Android.apk > RCH-Android.apk.sha256)

      - name: Upload unsigned CI build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RCH-Android-unsigned-build
          path: dist/RCH-Android-UNSIGNED-NOT-INSTALLABLE.apk
          retention-days: 7

      - name: Upload signed APK for verification
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RCH-Android-signed-build
          path: |
            dist/RCH-Android.apk
            dist/RCH-Android.apk.sha256
          retention-days: 30

  publish:
    name: Publish signed Android release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified signed build
        uses: actions/download-artifact@v4
        with:
          name: RCH-Android-signed-build
          path: dist

      - name: Publish official APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RCH Android App 1.0.${{ github.run_number }}
          make_latest: true
          prerelease: false
          body: |
            Official Rich City Hoops Android APK, signed with the permanent RCH release key.
            Android may require approval to install apps from the browser.
            Download RCH-Android.apk and confirm the checksum before installation.
            Visit https://richcityhoops.com/app for platform-specific installation guidance.
          files: |
            dist/RCH-Android.apk
            dist/RCH-Android.apk.sha256
