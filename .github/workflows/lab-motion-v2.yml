name: Lab Motion V2 Validation

on:
  pull_request:
    paths:
      - 'src/components/RiggedAthleteProof.tsx'
      - 'src/lib/labMotionLibrary.ts'
      - 'scripts/author-*.mjs'
      - 'scripts/bake-*.mjs'
      - 'scripts/validate-*.mjs'
      - 'scripts/lib/basketball-motion-*.mjs'
      - 'scripts/*quaternius*'
      - 'public/lab3d/athlete.glb'
      - 'package.json'
      - '.github/workflows/lab-motion-v2.yml'
  workflow_dispatch:

jobs:
  canonical-athlete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rebuild and validate full basketball training library
        run: npm run lab:library:verify
      - name: Verify all canonical GLB clips use task-space training engine V2
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const clips=[
            ['RCL_Defensive_Slide_v1','public/lab3d/RCL_Defensive_Slide_v1.glb'],
            ['RCL_Closeout_v1','public/lab3d/RCL_Closeout_v1.glb'],
            ['RCL_Triple_Threat_Jab_v1','public/lab3d/RCL_Triple_Threat_Jab_v1.glb'],
            ['RCL_Dribble_Stance_v1','public/lab3d/RCL_Dribble_Stance_v1.glb'],
            ['RCL_Chest_Pass_v1','public/lab3d/RCL_Chest_Pass_v1.glb'],
            ['RCL_Set_Shot_v1','public/lab3d/RCL_Set_Shot_v1.glb']
          ];
          for(const [name,path] of clips){
            const b=fs.readFileSync(path);if(b.toString('ascii',0,4)!=='glTF')throw Error('bad GLB '+path);
            const n=b.readUInt32LE(12),g=JSON.parse(b.toString('utf8',20,20+n).trim()),a=(g.animations||[]).find(x=>x.name===name);
            if(!a)throw Error('clip missing '+name);
            if(a.channels.length<18)throw Error(name+' missing full-body task-space tracks');
            if(a.extras?.engine!=='RCL_TASK_SPACE_IK_V2'||a.extras?.phaseModel!=='basketball-training-v3'||a.extras?.qualityGate!==true||a.extras?.stableHandWorldOrientation!==true||a.extras?.armsInFront!==true)throw Error(name+' missing V2 task-space quality contract');
          }
          console.log({motions:clips.length,engine:'RCL_TASK_SPACE_IK_V2',phaseModel:'basketball-training-v3'});
          NODE
      - name: Publish motion plans, quality reports, and rebuilt GLBs
        uses: actions/upload-artifact@v4
        with:
          name: lab-basketball-motion-library
          path: |
            public/lab3d/motion/*.json
            public/lab3d/RCL_Ready_Stance_v4.glb
            public/lab3d/RCL_Defensive_Slide_v1.glb
            public/lab3d/RCL_Closeout_v1.glb
            public/lab3d/RCL_Triple_Threat_Jab_v1.glb
            public/lab3d/RCL_Dribble_Stance_v1.glb
            public/lab3d/RCL_Chest_Pass_v1.glb
            public/lab3d/RCL_Set_Shot_v1.glb
          if-no-files-found: error
