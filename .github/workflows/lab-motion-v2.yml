name: Lab Motion V2 Validation

on:
  pull_request:
    paths:
      - 'src/lib/lab-motion-**'
      - 'src/lib/lab-quaternius-**'
      - 'scripts/*quaternius*'
      - 'scripts/bake-quaternius-ready-stance.mjs'
      - 'public/lab3d/athlete.glb'
      - 'package.json'
      - '.github/workflows/lab-motion-v2.yml'
  workflow_dispatch:

jobs:
  canonical-athlete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Analyze canonical athlete and bake validated ready stance
        run: npm run lab:v4:build
      - name: Author and validate defensive slide contract
        run: npm run lab:defensive-slide:bake
      - name: Verify defensive slide GLB structure
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('public/lab3d/RCL_Defensive_Slide_v1.glb');if(b.toString('ascii',0,4)!=='glTF')throw Error('bad defensive slide GLB');const n=b.readUInt32LE(12),g=JSON.parse(b.toString('utf8',20,20+n).trim()),a=(g.animations||[]).find(x=>x.name==='RCL_Defensive_Slide_v1');if(!a)throw Error('defensive slide clip missing');if(a.channels.length<7)throw Error('defensive slide missing pelvis/feet/leg mechanics tracks');if(a.extras?.canonicalStartEnd!=='RCL_Ready_Stance_v4')throw Error('defensive slide lost ready stance anchor');console.log({channels:a.channels.length,canonical:a.extras.canonicalStartEnd})"
      - name: Verify static GLB structure
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('public/lab3d/RCL_Ready_Stance_v4.glb');if(b.toString('ascii',0,4)!=='glTF')throw Error('bad GLB');const n=b.readUInt32LE(12),g=JSON.parse(b.toString('utf8',20,20+n).trim()),a=(g.animations||[]).find(x=>x.name==='RCL_Ready_Stance_v4');if(!a)throw Error('static stance clip missing');if(a.channels.length<9)throw Error('insufficient stance channels');console.log({bytes:b.length,channels:a.channels.length,nodes:(g.nodes||[]).length,skins:(g.skins||[]).length})"
      - name: Publish measured reports and static GLB
        uses: actions/upload-artifact@v4
        with:
          name: lab-motion-v4-reports
          path: |
            public/lab3d/motion/*.json
            public/lab3d/RCL_Ready_Stance_v4.glb
            public/lab3d/RCL_Defensive_Slide_v1.glb
            public/lab3d/motion/defensive-slide-v1-plan.json
          if-no-files-found: error
