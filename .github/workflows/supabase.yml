name: Supabase validation

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so CI is reproducible and does not depend on GitHub's
          # release API at job startup.
          version: 2.115.0
      - name: Start local database for validation
        run: supabase start
      - name: Validate complete migration sequence
        run: supabase db reset --local
      - name: Validate migration files
        run: supabase db lint --local
      - name: Run database authorization tests
        run: supabase test db --local
