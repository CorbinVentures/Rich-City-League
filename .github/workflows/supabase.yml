name: Supabase validation

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Pin CI image registry after CLI setup
        run: |
          # setup-cli@v1 exports GHCR after installation. Override it through
          # GITHUB_ENV so every subsequent step uses Docker Hub instead.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
          echo "SUPABASE_USE_SLIM_IMAGES=true" >> "$GITHUB_ENV"
      - name: Verify Docker runtime
        run: |
          docker version
          docker info
          docker system df
      - name: Start local database for validation
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            echo "Supabase start attempt $attempt of 4"
            if supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --debug 2>&1 | tee /tmp/supabase-start.log; then
              exit 0
            fi
            if grep -Eqi 'toomanyrequests|429|rate.?limit|failed to pull docker image|download failed' /tmp/supabase-start.log && [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Registry pull was rate limited; waiting before retry."
              sleep "$delay"
              continue
            fi
            exit 1
          done
          exit 1
      - name: Validate complete migration sequence
        run: supabase db reset --local
      - name: Validate migration files
        run: supabase db lint --local
      - name: Run database authorization tests
        run: supabase test db --local
      - name: Capture Supabase diagnostics
        if: failure()
        run: |
          echo "=== Supabase status ==="
          supabase status || true
          echo "=== Supabase start log ==="
          cat /tmp/supabase-start.log || true
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker disk usage ==="
          docker system df || true
